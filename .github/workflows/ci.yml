name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Migrate to Linux HTTP Node hosting once
        if: ${{ github.event_name == 'push' && hashFiles('.github/workflows/deploy-pages.yml') != '' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          app=Path('src/App.tsx')
          s=app.read_text()
          old="const serverUrl=import.meta.env.VITE_SERVER_URL??(import.meta.env.DEV?`${location.protocol==='https:'?'wss':'ws'}://${location.hostname}:8787`:location.protocol==='https:'?'wss://ws.leitstelle.verion-digital.de':'ws://ws.leitstelle.verion-digital.de:8787');"
          new="const serverUrl=import.meta.env.VITE_SERVER_URL??(import.meta.env.DEV?`ws://${location.hostname}:8787`:`ws://${location.host}/ws`);"
          if old in s: app.write_text(s.replace(old,new))

          p=Path('server/index.ts')
          s=p.read_text()
          old_import="import { dirname, resolve } from 'node:path';"
          new_import="import { dirname, extname, join, normalize, resolve, sep } from 'node:path';"
          if old_import not in s: raise SystemExit('Expected node:path import was not found')
          s=s.replace(old_import,new_import,1)
          marker="const MAX_MESSAGE_BYTES=16*1024;"
          addition="""
          const PORT=Number(process.env.PORT??8787);
          const HOST=process.env.HOST??'0.0.0.0';
          const CLIENT_DIST=resolve(process.env.CLIENT_DIST??'dist');
          const MIME:Record<string,string>={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.css':'text/css; charset=utf-8','.json':'application/json; charset=utf-8','.svg':'image/svg+xml','.png':'image/png','.jpg':'image/jpeg','.jpeg':'image/jpeg','.webp':'image/webp','.ico':'image/x-icon','.woff':'font/woff','.woff2':'font/woff2'};
          function serveClient(req:any,res:any){
            const pathname=decodeURIComponent(new URL(req.url??'/',`http://${req.headers.host??'localhost'}`).pathname);
            if(pathname==='/health'||pathname==='/api/health'){
              res.writeHead(200,{'content-type':'application/json; charset=utf-8','cache-control':'no-store'});
              res.end(JSON.stringify({name:'American Dispatch',status:'online',players:clients.size,facilities:state.facilities?.length??0}));
              return;
            }
            const requested=normalize(join(CLIENT_DIST,pathname==='/'?'index.html':pathname));
            const root=normalize(CLIENT_DIST);
            const safe=requested===root||requested.startsWith(root+sep);
            try{if(!safe)throw new Error('unsafe path');const data=readFileSync(requested);res.writeHead(200,{'content-type':MIME[extname(requested).toLowerCase()]??'application/octet-stream','cache-control':requested.endsWith('index.html')?'no-cache':'public, max-age=31536000, immutable'});res.end(data);}
            catch{try{const data=readFileSync(join(CLIENT_DIST,'index.html'));res.writeHead(200,{'content-type':'text/html; charset=utf-8','cache-control':'no-cache'});res.end(data);}catch{res.writeHead(503,{'content-type':'text/plain; charset=utf-8'});res.end('American Dispatch is starting.');}}
          }
          """
          if addition.strip() not in s:
            if marker not in s: raise SystemExit('Server constants marker was not found')
            s=s.replace(marker,marker+addition,1)
          s,n=re.subn(r"const http=createServer\(\(req,res\)=>\{.*?\}\);","const http=createServer((req,res)=>serveClient(req,res));",s,count=1,flags=re.S)
          if n!=1: raise SystemExit('HTTP createServer block was not found')
          s,n=re.subn(r"http\.listen\([^;]+\);","http.listen(PORT,HOST,()=>console.log(`American Dispatch server listening on ${HOST}:${PORT} · HTTP + WebSocket`));",s,count=1)
          if n!=1: raise SystemExit('http.listen call was not found')
          p.write_text(s)

          readme=Path('README.md')
          s=readme.read_text()
          s=s.replace('## [▶ Jetzt spielen](https://razerfazer-lang.github.io/LAPD/)', '## ▶ Produktionsbetrieb\n\nDas Spiel wird als Node.js-Webservice betrieben. Frontend und Multiplayer-WebSocket laufen über denselben HTTP-Host.')
          s=s.replace('Die GitHub-Pages-Version startet direkt im lokalen Simulationsbetrieb. Für eine\ngemeinsame Multiplayer-Sitzung ist zusätzlich ein konfigurierter WebSocket-Server\nerforderlich.', 'GitHub Pages ist kein Produktionshost mehr. Node.js liefert den Vite-Build direkt aus und stellt den Multiplayer-WebSocket unter `/ws` bereit.')
          s=s.replace('Die Client-Verbindung verwendet standardmäßig denselben Host auf Port `8787`.\nFür Reverse-Proxys oder getrennte Hosts kann `VITE_SERVER_URL` auf eine `ws://`\noder `wss://`-Adresse gesetzt werden.', 'Die Produktions-Client-Verbindung verwendet automatisch denselben HTTP-Host: `ws://<host>/ws`. Für den aktuellen Betrieb werden ausschließlich HTTP und `ws://` verwendet.')
          readme.write_text(s)
          PY
          rm -f .github/workflows/deploy-pages.yml
          rm -f .github/workflows/migrate-linux-http.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx server/index.ts README.md .github/workflows/deploy-pages.yml .github/workflows/migrate-linux-http.yml
          git diff --cached --quiet || (git commit -m "chore: migrate to Linux HTTP Node hosting" && git push origin HEAD:main)

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
