name: Fix game feature controls
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'fix: restore game feature controls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Patch feature wiring and styling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          s=s.replace('disabled={!connected||buildPending}', 'disabled={buildPending}')
          old="if(m.action==='BUILD_FACILITY'){setBuildMode(null);playDispatchAlert()}"
          new="if(m.action==='BUILD_FACILITY'){setBuildMode(null);playDispatchAlert()} if(m.action==='COMPLETE'){setProfile((p:any)=>{let xp=(Number(p.xp)||0)+100;let level=Number(p.level)||1;while(xp>=500){xp-=500;level++;}const n={...p,xp,level};persist(n);return n});setNotice((m.message??'Einsatz abgeschlossen.')+' · +100 XP')}"
          s=s.replace(old,new)
          p.write_text(s)
          q=Path('src/rebuild-extensions.css')
          css=q.read_text()
          css += '.agency-page{min-height:0}.agency-page,.ranks-page{color:#e5edf5}.service-cards{grid-column:1/-1}.facility-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.service-cards article,.facility-grid article{position:relative;background:#0d141d;border:1px solid #263545;padding:24px;color:#e5edf5}.service-cards article.selected{border-color:#58a6ff;box-shadow:0 0 0 1px #58a6ff33}.service-accent{height:3px;position:absolute;inset:0 0 auto}.service-cards h3,.facility-grid h3{margin:8px 0;font-size:22px}.service-cards p,.facility-grid span{color:#8495a6;font-size:11px}.service-cards strong{display:block;font-size:22px;margin:18px 0}.service-cards article button,.facility-grid button{border:1px solid #36506a;background:#142334;color:#dce8f1;padding:9px 12px;font-weight:800;cursor:pointer;margin-right:7px}.service-cards article button:disabled{opacity:.45;cursor:not-allowed}.upgrade-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:15px}.upgrade-grid button{margin:0;font-size:9px}.upgrade-grid small{display:block;color:#71869a;margin-top:4px}.rank-layout{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:22px;min-height:0}.rank-list{display:flex;flex-direction:column;gap:6px;overflow:auto}.rank-list button{display:grid;grid-template-columns:40px 1fr auto;align-items:center;text-align:left;background:#0d141d;border:1px solid #243343;color:#dfe8ef;padding:14px;cursor:pointer}.rank-list button.selected{border-color:#58a6ff;background:#13202e}.rank-list span{color:#6f8294;font-size:10px}.rank-list b{font-size:12px}.rank-list small{color:#71869a;font-size:8px}.rank-detail{margin:0!important;align-self:start}.world-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:30px}.world-grid article{background:#0d141d;border:1px solid #243343;padding:20px;color:#e5edf5}.world-grid small{color:#71869a;letter-spacing:.12em}.world-grid h3{margin:8px 0}.world-grid p{color:#8a9aab;font-size:11px}.world-grid button{border:1px solid #36506a;background:#142334;color:#e5edf5;padding:8px 12px;margin-right:6px;cursor:pointer}.game-tabs{position:relative;z-index:100}.game-tabs button{position:relative;z-index:101}.map-wrap{position:relative;min-width:0;min-height:0;overflow:hidden}.build-banner{position:absolute;z-index:90;top:10px;left:50%;transform:translateX(-50%);padding:10px 16px;background:#101923ee;border:1px solid #58a6ff;color:#e5edf5;font-weight:900;font-size:10px;pointer-events:none}@media(max-width:900px){.rank-layout,.facility-grid{grid-template-columns:1fr}.service-cards{grid-template-columns:1fr}.upgrade-grid{grid-template-columns:repeat(2,1fr)}}'
          q.write_text(css)
          PY
      - name: Verify
        run: npm install && npm test && npm run build
      - name: Commit feature fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/rebuild-extensions.css
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore game feature controls'
          git push
