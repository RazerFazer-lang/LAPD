<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>American Dispatch – Local Test</title><style>body{font-family:Arial,sans-serif;background:#0b1117;color:#e7eef5;margin:0;padding:32px}main{max-width:900px;margin:auto}h1{margin:0 0 8px}p{color:#aab7c4}.card{background:#121b24;border:1px solid #2b3a48;border-radius:10px;padding:18px;margin:14px 0}button,input{padding:10px 12px;border-radius:6px;border:1px solid #405363;background:#18232e;color:#fff;margin:4px}button{cursor:pointer;font-weight:700}.ok{color:#65d391}.bad{color:#ff7d7d}.mono{font-family:monospace;word-break:break-all}#log{white-space:pre-wrap;background:#070b0f;padding:14px;border-radius:6px;min-height:140px}</style></head><body><main><h1>AMERICAN DISPATCH · LOCAL DIAGNOSTIC</h1><p>Diese Seite testet Frontend und WebSocket getrennt vom eigentlichen Spiel-Overlay.</p><div class="card"><h2>1. WebSocket-Server</h2><input id="url" value="ws://localhost:8787" size="32"><button onclick="testWS()">VERBINDUNG TESTEN</button><div id="status">Noch nicht getestet.</div></div><div class="card"><h2>2. HTTP-Server</h2><button onclick="testHTTP()">/health TESTEN</button><div id="http">Noch nicht getestet.</div></div><div class="card"><h2>3. Browser / Frontend</h2><div id="browser"></div></div><div class="card"><h2>Log</h2><div id="log"></div></div></main><script>const logEl=document.querySelector('#log');function log(x){logEl.textContent+=new Date().toLocaleTimeString()+'  '+x+'\n'}document.querySelector('#browser').innerHTML='Origin: <span class="mono">'+location.origin+'</span><br>Host: <span class="mono">'+location.host+'</span><br>WebSocket-Unterstützung: '+('WebSocket'in window?'JA':'NEIN');async function testHTTP(){const out=document.querySelector('#http');try{const base=location.origin;const r=await fetch(base+'/health',{cache:'no-store'});const t=await r.text();out.className=r.ok?'ok':'bad';out.textContent=r.status+' · '+t;log('HTTP /health: '+r.status)}catch(e){out.className='bad';out.textContent='FEHLER: '+e;log('HTTP FEHLER: '+e)}}function testWS(){const url=document.querySelector('#url').value.trim();const out=document.querySelector('#status');out.textContent='Verbinde…';out.className='';log('WS Verbindung zu '+url);try{const w=new WebSocket(url);const timer=setTimeout(()=>{if(w.readyState===0){out.className='bad';out.textContent='TIMEOUT – Port/Firewall/Server nicht erreichbar';w.close();log('WS TIMEOUT')}},5000);w.onopen=()=>{clearTimeout(timer);out.className='ok';out.textContent='VERBUNDEN ✓';log('WS OPEN');w.send(JSON.stringify({type:'HELLO',name:'LOCAL-DIAGNOSTIC',ready:true}))};w.onmessage=e=>{log('WS MESSAGE: '+e.data.slice(0,1000));try{const m=JSON.parse(e.data);if(m.type==='HELLO_ACK'){out.className='ok';out.textContent='VERBUNDEN ✓ · HELLO_ACK erhalten · Player '+m.playerId}}catch{}};w.onerror=()=>{clearTimeout(timer);out.className='bad';out.textContent='WEBSOCKET-FEHLER';log('WS ERROR')};w.onclose=()=>{log('WS CLOSED code='+w.code)}}catch(e){out.className='bad';out.textContent='FEHLER: '+e;log('WS EXCEPTION: '+e)}}</script></body></html>
